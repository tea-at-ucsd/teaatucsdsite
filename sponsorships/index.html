<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsorships | TEA @ UCSD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-gray-50 font-sans antialiased">
    <nav class="nav-backdrop text-white shadow-lg fixed w-full z-50 transition-all duration-300">
        <div class="container mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <a href="../index.html" class="flex items-center space-x-3">
                    <img src="../assets/TEA_logo.png" onerror="this.src='https://placehold.co/56x56/0c4a6e/fff?text=TEA+Logo'" alt="TEA Logo" class="h-14 rounded-lg">
                    <span class="text-xl font-semibold">TEA @ UCSD</span>
                </a>
                <a href="../index.html" class="hidden md:inline-flex items-center text-white hover:text-accent-400 transition-all font-medium px-3 py-2 rounded-lg hover:bg-primary-800">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Home
                </a>
            </div>
        </div>
    </nav>

    <section class="pt-32 pb-20 hero-gradient text-white">
        <div class="container mx-auto px-6">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">Support the Next Generation of Storytellers</h1>
                <div class="w-24 h-1.5 bg-accent-400 mx-auto rounded-full mb-6"></div>
                <p class="text-lg md:text-xl leading-relaxed text-gray-200">
                    Sponsorships help TEA @ UC San Diego fund hands-on projects, student competitions, and immersive experiences that bring themed entertainment to life.
                </p>
            </div>
        </div>
    </section>

    
    <section class="py-12 bg-white">
        <div class="container mx-auto px-6">
            <div class="max-w-6xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-primary-900">Sponsor Information</h2>
                <div class="info-gallery flex flex-col gap-8">
                    <figure>
                        <img src="../assets/sponsorships/SponsorshipPacket_title.jpg" alt="Info 1" loading="lazy" onerror="this.src='https://placehold.co/1200x800/0c4a6e/fff?text=Info+1'">
                        <figcaption class="mt-2 text-center text-sm text-gray-700">Sponsorship Packet: Title</figcaption>
                    </figure>
                    <figure>
                        <img src="../assets/sponsorships/SponsorshipPacket_who.jpg" alt="Info 2" loading="lazy" onerror="this.src='https://placehold.co/1200x800/075985/fff?text=Info+2'">
                        <figcaption class="mt-2 text-center text-sm text-gray-700">Sponsorship Packet: Purpose</figcaption>
                    </figure>
                    <figure>
                        <img src="../assets/sponsorships/SponsorshipPacket_REC.jpg" alt="Info 3" loading="lazy" onerror="this.src='https://placehold.co/1200x800/0369a1/fff?text=Info+3'">
                        <figcaption class="mt-2 text-center text-sm text-gray-700">Sponsorship Packet: Rec Competition</figcaption>
                    </figure>
                    <figure>
                        <img src="../assets/sponsorships/SponsorshipPacket_TMTDC.jpg" alt="Info 4" loading="lazy" onerror="this.src='https://placehold.co/1200x800/0c4a6e/fff?text=Info+4'">
                        <figcaption class="mt-2 text-center text-sm text-gray-700">Sponsorship Packet: TMTDC Competition</figcaption>
                    </figure>
                    <figure>
                        <img src="../assets/sponsorships/SponsorshipPacket_tiers.jpg" alt="Info 5" loading="lazy" onerror="this.src='https://placehold.co/1200x800/075985/fff?text=Info+5'">
                        <figcaption class="mt-2 text-center text-sm text-gray-700">Sponsorship Packet: Tier Benefits</figcaption>
                    </figure>
                    <figure>
                        <img src="../assets/sponsorships/SponsorshipPacket_end.jpg" alt="Info 6" loading="lazy" onerror="this.src='https://placehold.co/1200x800/0369a1/fff?text=Info+6'">
                        <figcaption class="mt-2 text-center text-sm text-gray-700">Sponsorship Packet: Conclusion</figcaption>
                    </figure>
                </div>
            </div>
        </div>
    </section>

    <script src="../script.js"></script>
</body>
</html>
